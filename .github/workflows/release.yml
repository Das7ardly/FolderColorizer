# Builds the installer on GitHub's own Windows machines.
# Every push: builds and keeps the installer as a downloadable artifact.
# A tag like v1.1.0: also publishes a GitHub Release with the installer attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem installer\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content installer\SHA256SUMS.txt
          Get-Content installer\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            installer/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Windows 10/11 x64 installer. Built by GitHub Actions from this tag; check the download against SHA256SUMS.txt.
            Code signing policy: see the [README](https://github.com/Das7ardly/FolderColorizer#code-signing-policy).
